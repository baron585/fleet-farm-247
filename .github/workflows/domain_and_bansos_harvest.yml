name: Dedicated Domain & Bansos Cloud Harvester (Mass Matrix)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to harvest (all, ifm, aiclub, idwebhost)'
        required: true
        default: 'all'

permissions:
  contents: write

jobs:
  mass-cloud-harvester:
    name: Cloud Minter Cluster #${{ matrix.cluster_id }} (16GB RAM Azure Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cluster_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Camoufox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps firefox
          python -m camoufox fetch

      - name: Mass Harvest IFM 10M Token API Keys (Cluster ${{ matrix.cluster_id }})
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ifm' }}
        run: |
          xvfb-run -a python ifm_farmer.py --worker-id ${{ matrix.cluster_id }} --count 4 --output ifm_fleet_keys_cluster_${{ matrix.cluster_id }}.jsonl

      - name: Harvest Free Domains & Subdomains (AICLUB & IDWebHost) (Cluster ${{ matrix.cluster_id }})
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'aiclub' || github.event.inputs.target == 'idwebhost' }}
        run: |
          xvfb-run -a python aiclub_farmer.py --output fleet_domains_cluster_${{ matrix.cluster_id }}.jsonl || true
          xvfb-run -a python idwebhost_farmer.py --worker-id ${{ matrix.cluster_id }} --output fleet_domains_cluster_${{ matrix.cluster_id }}.jsonl || true

      - name: Commit and Push Harvested Domains and Keys
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch ifm_fleet_keys_cluster_${{ matrix.cluster_id }}.jsonl fleet_domains_cluster_${{ matrix.cluster_id }}.jsonl
          git add ifm_fleet_keys_cluster_${{ matrix.cluster_id }}.jsonl fleet_domains_cluster_${{ matrix.cluster_id }}.jsonl
          if ! git diff --staged --quiet; then
            git commit -m "Auto-harvest: Fresh Mass Keys (Cluster ${{ matrix.cluster_id }}) [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            for attempt in {1..20}; do
              if git push origin main; then
                echo "Successfully pushed results for cluster ${{ matrix.cluster_id }} on attempt $attempt"
                break
              fi
              echo "Push collision on cluster ${{ matrix.cluster_id }}, rebasing..."
              git pull --rebase origin main || git rebase --abort
              sleep $((RANDOM % 5 + 3))
            done
          fi

  aggregate-keys:
    name: Aggregate Harvested Fleet Keys & Domains
    needs: [mass-cloud-harvester]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Sharded Outputs into Master Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

          shopt -s nullglob
          ifm_files=(ifm_fleet_keys_cluster_*.jsonl)
          domain_files=(fleet_domains_cluster_*.jsonl)

          if [ ${#ifm_files[@]} -gt 0 ]; then
            cat "${ifm_files[@]}" >> ifm_fleet_keys.jsonl
            git rm "${ifm_files[@]}"
          fi

          if [ ${#domain_files[@]} -gt 0 ]; then
            cat "${domain_files[@]}" >> fleet_domains.jsonl
            git rm "${domain_files[@]}"
          fi

          git add ifm_fleet_keys.jsonl fleet_domains.jsonl 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-harvest: Master Fleet Key & Domain Aggregation [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            for attempt in {1..10}; do
              if git push origin main; then
                echo "Aggregation pushed successfully on attempt $attempt"
                break
              fi
              git pull --rebase origin main || git rebase --abort
              sleep $((RANDOM % 4 + 2))
            done
          else
            echo "No sharded files to aggregate."
          fi
