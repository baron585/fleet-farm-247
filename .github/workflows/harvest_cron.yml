name: Autonomous Fleet Minter 24/7

on:
  schedule:
    # Berjalan otomatis setiap 5 menit (288 siklus per hari di cloud runner)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol manual 'Run workflow'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Camoufox & Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps firefox
          python -m camoufox fetch

      - name: Run Complete Multi-Engine Cloud Minter
        run: |
          xvfb-run -a python runner.py --dahl-count 8 --gonka-count 2 --th-count 1 --grok-count 1 --jio-sweeps 3

      - name: Commit and Push Harvested Keys & Links
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch jio_activation_links.txt fleet_keys.jsonl
          git add fleet_keys.jsonl jio_activation_links.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto-harvest: Fresh multi-engine fleet [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git pull --rebase origin main
            git push origin main
          fi
